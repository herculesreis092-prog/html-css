<!DOCTYPE html>
<html lang="pt4">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação Slide</title>
    <style>
        .slider {
           width: 600px;
           height: 300px;
           overflow: hidden;
           margin: auto;
           border-radius: 10px;
        }

        .slides {
           display: flex;
           width: 300px;
           animation: slide 9s infinite;
        }
        
        .slides img {
            width: 100%;
            height: 300px;
            object-fit: cover;

        }



        @keyframes slide {
           0%   { transform: translateX(0); }
           33%  { transform: translateX(-100%); }
           66%  { transform: translateX(-200%); }
           100% { transform: translateX(0); }
        }


    </style>
</head>
<body>
    <div class="slider">
        <div class="slides">
            <img src="imagens/pattern001.png" alt="imagem 1">
            <img src="imagens/pattern002.png" alt="imagem 2">
            <img src="imagens/pattern003.png" alt="imagem 3">

        </div>
    </div>
</body>
</html>
