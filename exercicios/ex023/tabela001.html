<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            border-collapse: collapse;
           
        }

        tr#L1 {
            background-color: gray;
        }

        tr#L2 {
            background-color: green;
        }

        tr#L3 {
            background-color: blue;
        }

        td {
            border: 1px solid black;
            padding: 8px;
        }

        table.dado {
            background-color: yellow;
        }

    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table class="dado">
        <tr id="L1">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr id="L2">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr id="L3">
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr id="L4">
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
